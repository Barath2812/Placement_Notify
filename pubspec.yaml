name: campus_notify
description: "CampusNotify - Official College Notice and Announcement Client"
version: 1.0.0+1

publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Navigation & State
  go_router: ^13.0.0
  provider: ^6.1.2

  # Firebase & Auth
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  google_sign_in: ^6.2.1
  firebase_messaging: ^14.7.19

  # Local Notification & Utilities
  flutter_local_notifications: ^16.3.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  url_launcher: ^6.2.5
  cached_network_image: ^3.3.1
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
